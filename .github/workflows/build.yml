name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Compile
        run: python llc.py -a osbasilisc/main.li -o basilisc.bin

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: basilisc.bin
          path: basilisc.bin
      
      - name: Upload executable to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "latest" --yes || true
          gh release create "latest" basilisc.bin --title "Automatic build" --notes "this release was automatically generated by GitHub Actions"
