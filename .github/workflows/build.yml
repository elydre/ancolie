name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3

      - name: Compile
        run: |
          python llc.py osbasilisc/main.li -o basilisc.bin
          python llc.py programs/flappy.li -o flappy.bin

      - name: Upload executable to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "latest" --yes || true
          gh release create "latest" basilisc.bin flappy.bin --title "Automatic build" --notes "this release was automatically generated by GitHub Actions"
